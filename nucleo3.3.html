<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Generación de imágenes con IA • Arte digital</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./estilos-nucleo2.css" />
  </head>
  <body class="pantalla-buenas_exp">
    <div class="pantalla4">
      
    <h1>Ordená las etapas del proceso de Tomás García</h1>
    <div class="game-container">
      <div class="textoIzDer">
        <h3>Orden del proceso</h3>
        <h3 class="resaltado5" id="attempts-text">
          Intento <span id="attempts-count">1</span> de 3
        </h3>
      </div>
      <!-- Casillas de destino. Cambiar dgradado de botón de malas expriencias a F4A794-->
      <div class="slots-container">
        <div class="slot dropzone" data-expected="item-1">
          <span>1</span>
          <img class="icono_rata" alt="" hidden />
        </div>
        <div class="slot dropzone" data-expected="item-2">
          <span>2</span>
          <img class="icono_rata" alt="" hidden />
        </div>
        <div class="slot dropzone" data-expected="item-3">
          <span>3</span>
          <img class="icono_rata" alt="" hidden />
        </div>
        <div class="slot dropzone" data-expected="item-4">
          <span>4</span>
          <img class="icono_rata" alt="" hidden />
        </div>
      </div>

      <h3 id="avestruz">Etapas</h3>

      <!-- Contenedor inicial de las piezas -->
      <div class="items-container dropzone" id="start-zone">
        <div class="draggable" draggable="true" id="item-3">
          <img src="img/pulir_detalles_contenedor.png" alt="Pulir detalles" class="drag-image" />
        </div>
        <div class="draggable" draggable="true" id="item-1">
          <img src="img/experimentar_contenedor.png" alt="Experimentar" class="drag-image" />
        </div>
        <div class="draggable" draggable="true" id="item-4">
          <img src="img/seleccionar_contenedor.png" alt="Seleccionar" class="drag-image" />
        </div>
        <div class="draggable" draggable="true" id="item-2">
          <img src="img/entrenar_contenedor.png" alt="Entrenar" class="drag-image" />
        </div>
      </div>


      <div class="mensajito">
        <img id="resultado-img" src="img/correcto_casillero.png" alt="" hidden />
        <p id="message"></p>
      </div>

    </div>

    <script src="script.js"></script>
  </body>
  <footer>
    <div class="instruccion">
      <img src="img/pincel.png" alt="Pincel" class="imgPincel" />
      <p>Arrastrá cada etapa a su casillero y comprobá</p>
    </div>
    <button id="verify-btn" class="boton3 deshabilitado" type="button" disabled>
      <span id="verificando_organos">Comprobar</span>
      <img src="img/tilde.png" alt="" />
    </button>
  </footer>
  </div>
</html>
